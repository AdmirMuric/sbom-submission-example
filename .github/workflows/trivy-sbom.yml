name: Generate Trivy SBOM

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - src/**
      - .github/workflows/trivy-sbom.yml

permissions:
  contents: write

jobs:
  trivy-sbom:
    name: Generate and submit dependency snapshot with Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies with lock file
        run: dotnet restore SbomSubmissionExample.sln --use-lock-file

      - name: Generate and submit Trivy dependency snapshot
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: github
          output: dependency-results.sbom.json
          scan-ref: .
          github-pat: ${{ secrets.GITHUB_TOKEN }}