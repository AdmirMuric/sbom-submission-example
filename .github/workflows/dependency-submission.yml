name: Dependency Submission

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - .github/actions/**
      - .github/workflows/dependency-submission.yml

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  container-sbom:
    name: Generate and submit container SBOM (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: dotnet-app
            dockerfile: src/SbomSubmissionExample/Dockerfile
            manifest: src/SbomSubmissionExample/SbomSubmissionExample.csproj
            dotnet: true
          - name: python-hello
            dockerfile: src/python-hello/Dockerfile
            manifest: src/python-hello/requirements.txt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        if: matrix.service.dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build app
        if: matrix.service.dotnet
        run: dotnet build SbomSubmissionExample.sln --configuration Release

      - name: Docker login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set image metadata
        id: image
        shell: bash
        env:
          SERVICE: ${{ matrix.service.name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}"
          tag="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        id: push_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}

      - name: Generate SBOM from image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: ${{ matrix.service.name }}.spdx.json

      - name: Upload depsjson
        if: matrix.service.dotnet
        uses: actions/upload-artifact@v4
        with:
          name: sbom-submission-example-application-entry
          path: src/SbomSubmissionExample/bin/Release/net8.0/SbomSubmissionExample.deps.json
          if-no-files-found: error

      - name: Normalize SPDX dependency relationships and direct references
        shell: bash
        run: |
          tmp_file=$(mktemp)
          jq '
            .relationships |= map(
              if .relationshipType == "DEPENDENCY_OF" then
                .spdxElementId as $dependency
                | .relatedSpdxElement as $dependent
                | .spdxElementId = $dependent
                | .relatedSpdxElement = $dependency
                | .relationshipType = "DEPENDS_ON"
              else
                .
              end
            )
            | [.relationships[] | select(.relationshipType == "DEPENDS_ON")] as $edges
            | ($edges | map(.relatedSpdxElement)) as $has_parent
            # NuGet: Syft emits the app itself as a parentless package; its children are the direct references.
            # Other ecosystems (deb, apk, rpm, pypi, ...) have no app package, so parentless packages are already direct.
            | [
                .packages[]
                | select(any(.externalRefs[]?; .referenceType == "purl" and (.referenceLocator | startswith("pkg:nuget/"))))
                | .SPDXID
                | select(. as $id | ($has_parent | index($id) | not) and any($edges[]; .spdxElementId == $id))
              ] as $nuget_apps
            | .relationships += [
                $edges[]
                | select(.spdxElementId | IN($nuget_apps[]))
                | {spdxElementId: "SPDXRef-RootPackage", relationshipType: "DEPENDS_ON", relatedSpdxElement: .relatedSpdxElement}
              ]
          ' sbom.spdx.json > "$tmp_file"
          mv "$tmp_file" sbom.spdx.json

      - name: Create SBOM release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: sbom-${{ matrix.service.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          name: sbom-${{ matrix.service.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          prerelease: true
          files: |
            sbom.spdx.json
            README.md

      - name: Create SBOM attestation
        uses: ./.github/actions/github-create-sbom-attestation
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push_image.outputs.digest }}
          sbom-path: sbom.spdx.json
          release-tag: sbom-${{ matrix.service.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          release-title: sbom-${{ matrix.service.name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Submit SBOM to Dependency Graph
        uses: ./.github/actions/sbom-dependency-submission
        with:
          subject: ${{ steps.image.outputs.name }}
          digest: ${{ steps.push_image.outputs.digest }}
          correlator: syft-${{ matrix.service.name }}
          manifestInput: ${{ matrix.service.manifest }}
          token: ${{ secrets.GITHUB_TOKEN }}